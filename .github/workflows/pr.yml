name: PR Workflow

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint / Typecheck / Build (bun)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install deps (bun)
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx eslint src/

      - name: Typecheck (tsc --noEmit)
        run: bunx tsc --noEmit

      - name: Test
        run: bun run test

      - name: Build (Next.js)
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_CONVEX_URL: "https://fine-flamingo-162.convex.cloud"

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          if-no-files-found: ignore

  size-check:
    name: Bundle Size Check (bun)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bunx next build --profile 2>&1 | tee build.log || true
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Comment bundle hint
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          header: bundle-size
          message: |
            ### 📦 Build completed (bun)
            Commit: `${{ github.sha }}`
            Workflow: `${{ github.workflow }}` — checks passed. Preview will deploy via Netlify.

  auto-merge-ready:
    name: Label PR Ready
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'pull_request' && success()
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['ci:passed']
            }).catch(()=>{});
            github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              name: 'ci:failed'
            }).catch(()=>{});
