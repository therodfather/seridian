version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "eslint-config-next"
      types:
        patterns:
          - "@types/*"

  - package-ecosystem: gradle
    directory: /android-client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - android
