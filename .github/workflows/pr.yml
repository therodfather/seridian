name: PR Workflow

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_CONVEX_URL: "https://fine-flamingo-162.convex.cloud"

jobs:
  ci:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install deps (bun)
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit + Convex tests
        run: bun run test
      - name: Build (Next.js)
        run: bun run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-e2e-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-e2e-
      - name: Install deps (bun)
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Download Next.js build
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - name: Run Playwright smoke (PR)
        if: github.event_name == 'pull_request'
        run: bun run test:e2e:smoke
        env:
          CI: true
      - name: Run Playwright full suite (main)
        if: github.event_name == 'push'
        run: bun run test:e2e
        env:
          CI: true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  size-check:
    name: Preview checklist
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'pull_request'
    steps:
      - uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: bundle-size
          message: |
            ### CI passed (bun ${{ env.BUN_VERSION }})
            Commit: `${{ github.sha }}`
            - Lint, typecheck, unit/Convex tests, and production build are green.
            - Playwright **smoke** ran on this PR. Full e2e runs on `main`.
            - Netlify Deploy Preview is posted by the Netlify Git integration (`netlify.toml`), not this workflow.

  auto-merge-ready:
    name: Label PR Ready
    runs-on: ubuntu-latest
    needs: [ci, e2e]
    if: github.event_name == 'pull_request' && success()
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['ci:passed']
            }).catch(()=>{});
            github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              name: 'ci:failed'
            }).catch(()=>{});
