[build]
  command = "bun run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "1.3.14"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"
  # Public client URL — required at build time for dashboard Convex auth (matches CI).
  NEXT_PUBLIC_CONVEX_URL = "https://fine-flamingo-162.convex.cloud"
