name: Android CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: android-client

      - name: Run unit tests
        run: ./gradlew test
        working-directory: android-client

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: android-client/build/reports/tests/
          if-no-files-found: ignore

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: android-client

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
        working-directory: android-client

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: seridian-chat-debug
          path: android-client/build/outputs/apk/debug/
          if-no-files-found: warn

  release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: android-client

      - name: Build release APK
        run: ./gradlew :app:assembleRelease
        working-directory: android-client

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: seridian-chat-release
          path: android-client/build/outputs/apk/release/
          if-no-files-found: warn
