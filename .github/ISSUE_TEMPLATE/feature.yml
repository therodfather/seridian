name: Feature request
description: Propose a feature
title: "feat: "
labels: ["type:feature"]
body:
  - type: dropdown
    id: track
    attributes:
      label: Track
      options:
        - track:ui-kit
        - track:webgl
        - track:fonts
        - track:workflow
      default: 0
    validations:
      required: true
  - type: input
    id: worktree
    attributes:
      label: Worktree path
      description: Dedicated worktree for this feature
      placeholder: "/tmp/wt-feature-xyz  (git worktree add /tmp/wt-feature-xyz -b feature/xyz main)"
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should be built? Reference ui-kit / WebGL / fonts as needed.
      placeholder: "As a ... I want ... so that ..."
    validations:
      required: true
  - type: textarea
    id: ac
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] `bun run lint` passes
        - [ ] `bunx tsc --noEmit` passes
        - [ ] `bun run build` succeeds
        - [ ] No CLS regression, fonts display:swap, prefers-reduced-motion respected
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / links
      description: Figma, related PRs
