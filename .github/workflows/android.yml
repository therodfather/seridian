name: Android CI

on:
  push:
    branches: [main]
    tags: ["android-v*"]
  pull_request:
    branches: [main]
    paths:
      - "android-client/**"
      - ".github/workflows/android.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: android-client
      - name: Run unit tests
        run: ./gradlew check --stacktrace
        working-directory: android-client
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: android-client/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  prerelease:
    name: Package Android library
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/android-v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: android-client
      - name: Assemble library
        run: ./gradlew assemble --stacktrace
        working-directory: android-client
      - name: Package AAR zip artifact
        run: |
          mkdir -p release-dist
          zip -r "release-dist/${GITHUB_REF_NAME}.aar.zip" android-client/build/outputs/aar/
      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Android Client ${{ github.ref_name }}"
          body: |
            Seridian Android client library built from `${{ github.sha }}`.
          prerelease: true
          files: release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
