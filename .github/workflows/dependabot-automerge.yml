name: Dependabot auto-merge

# Auto-merges Dependabot PRs, but only patch/minor bumps — majors always need
# a human (see .github/dependabot.yml ignore rules + todo.md freeze list).
# Requires branch protection on the target branch with required status checks,
# otherwise `gh pr merge --auto` merges immediately instead of waiting on CI.

on:
  pull_request:
    branches: [main, android-dev]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for patch/minor bumps
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
