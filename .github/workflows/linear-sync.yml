name: Linear Sync

on:
  issues:
    types: [labeled, opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  linear-comment:
    name: Comment Linear link (bun-only stub)
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && contains(join(github.event.issue.labels.*.name, ','), 'track:')
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Comment Linear ↔ GitHub link
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) return;
            const body = issue.body || "";
            // Look for Linear: SER-X pattern already in issue body
            const m = body.match(/SER-\d+/);
            const linearRef = m ? m[0] : "(add `Linear: SER-X` to issue body)";
            const hasLinearComment = (await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
            })).data.some(c => c.body.includes("Linear ↔ GitHub tandem"));

            if (hasLinearComment) {
              console.log("Already commented — skipping");
              return;
            }

            const trackLabel = (issue.labels || []).map(l => typeof l === 'string' ? l : l.name).find(n => n.startsWith('track:')) || 'track:workflow';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: [
                `### 🔗 Linear ↔ GitHub tandem`,
                ``,
                `- **Linear:** \`${linearRef}\` — https://linear.app/seridian/issue/${linearRef}`,
                `- **GitHub:** Fixes #${issue.number} (add \`Fixes #${issue.number}\` to your PR body)`,
                `- **Track:** \`${trackLabel}\`  •  **Worktree:** \`git worktree add /tmp/wt-<slug> -b feature/<slug> main\``,
                ``,
                `> **Workflow:** Create Linear issue via official MCP (\`linear_create_issue\` on \`https://mcp.linear.app/mcp\` via \`mcp-remote\`), mirror with \`gh issue create --label ${trackLabel} --body \"Linear: ${linearRef}\"\`. PR must contain \`Linear: ${linearRef}\` and \`Fixes #${issue.number}\`. CI is bun-only (\`bun install --frozen-lockfile\`, \`bun run lint\`, \`bunx tsc --noEmit\`, \`bun run build\`).`,
                ``,
                `<!-- linear-sync: SER-X bot — uses gh cli + linear MCP notes; official MCP only https://mcp.linear.app/mcp, fallback PAT LINEAR_API_KEY if OAuth blocked -->`,
              ].join("\n"),
            });

      # Optional bun check to prove workflow is bun-only even though this job is js-only
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun --version
