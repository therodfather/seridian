name: Track task
description: Frontend track task (ui-kit / webgl / fonts / workflow)
title: "track: "
labels: ["track:workflow"]
body:
  - type: dropdown
    id: track
    attributes:
      label: Track
      description: Select the track this issue belongs to
      options:
        - track:ui-kit
        - track:webgl
        - track:fonts
        - track:workflow
      default: 3
    validations:
      required: true
  - type: input
    id: worktree
    attributes:
      label: Worktree path
      description: "Exact worktree path (git worktree add <path> -b <branch> main)"
      placeholder: "/tmp/wt-feature-xyz (feature/xyz)"
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Branch
      placeholder: "feature/xyz"
    validations:
      required: false
  - type: textarea
    id: ac
    attributes:
      label: Acceptance criteria
      description: Checklist that defines done (bun-only, no npm)
      placeholder: |
        - [ ] `bun install --frozen-lockfile` clean
        - [ ] `bun run lint` passes
        - [ ] `bunx tsc --noEmit` passes
        - [ ] `bun run build` succeeds (Next.js)
      value: |
        - [ ] `bun install --frozen-lockfile` clean
        - [ ] `bun run lint` passes
        - [ ] `bunx tsc --noEmit` passes
        - [ ] `bun run build` succeeds
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope / notes
      description: What files / components will be touched?
      placeholder: "e.g. src/components/WebGLHero.tsx"
