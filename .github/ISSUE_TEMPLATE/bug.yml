name: Bug report
description: Report a bug
title: "fix: "
labels: ["type:bug"]
body:
  - type: dropdown
    id: track
    attributes:
      label: Track
      description: Which frontend track does this belong to?
      options:
        - track:ui-kit
        - track:webgl
        - track:fonts
        - track:workflow
      default: 0
    validations:
      required: true
  - type: input
    id: worktree
    attributes:
      label: Worktree path
      description: Worktree for this issue (e.g. /tmp/wt-linear or /tmp/wt-bug-xyz)
      placeholder: "/tmp/wt-linear"
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps to reproduce, expected vs actual
      placeholder: |
        1. bun install && bun run dev
        2. ...
        Expected: ...
        Actual: ...
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: bun --version, OS, browser, branch/commit
      placeholder: "bun 1.2.x, macOS, branch feature/bug-xyz @ abc123"
  - type: textarea
    id: ac
    attributes:
      label: Acceptance criteria
      description: When is this done?
      placeholder: "- [ ] `bun run lint && bunx tsc --noEmit && bun run build` passes"
